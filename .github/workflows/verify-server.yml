name: Verify server and backup

on:
  workflow_dispatch:
    inputs:
      server_ip:
        description: Server public IPv4
        required: true
        type: string
      server_user:
        description: SSH user with passwordless sudo
        required: true
        default: admin
        type: string
      host_fingerprint:
        description: Verified ED25519 SHA256 host fingerprint
        required: true
        type: string
      mode:
        description: Read status or verify an independent backup restore
        required: true
        default: status
        type: choice
        options: [status, backup-drill]

permissions:
  contents: read

concurrency:
  group: server-deployment
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SERVER_IP: ${{ inputs.server_ip }}
      SERVER_USER: ${{ inputs.server_user }}
      EXPECTED_FINGERPRINT: ${{ inputs.host_fingerprint }}
      VERIFY_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify server identity and deployment
        env:
          DEPLOY_SSH_KEY: ${{ secrets.AGILECAMPUS_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ipaddress, os, re
          ipaddress.IPv4Address(os.environ['SERVER_IP'])
          assert re.fullmatch(r'[a-z_][a-z0-9_-]*', os.environ['SERVER_USER'])
          assert os.environ['VERIFY_MODE'] in ('status', 'backup-drill')
          PY
          umask 077
          test -n "$DEPLOY_SSH_KEY"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/agilecampus-key"
          ssh-keyscan -T 15 -t ed25519 "$SERVER_IP" > "$RUNNER_TEMP/agilecampus-known-hosts"
          actual="$(ssh-keygen -lf "$RUNNER_TEMP/agilecampus-known-hosts" | awk '{print $2}')"
          test "$actual" = "$EXPECTED_FINGERPRINT"
          ssh -i "$RUNNER_TEMP/agilecampus-key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/agilecampus-known-hosts" -o ConnectTimeout=20 "$SERVER_USER@$SERVER_IP" "sudo -n bash -s -- $VERIFY_MODE" < scripts/verify-server.sh
      - name: Check public TLS certificate and health
        run: |
          curl --fail --silent --show-error --max-time 20 "https://$SERVER_IP/api/health"
          openssl s_client -connect "$SERVER_IP:443" </dev/null 2>/dev/null | openssl x509 -noout -issuer -dates -ext subjectAltName
      - name: Remove runner credential
        if: always()
        run: rm -f "$RUNNER_TEMP/agilecampus-key"
