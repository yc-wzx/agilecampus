name: Verify public website in browser

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-browser-verification
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated browser tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/browser-qa"
          npm install --prefix "$RUNNER_TEMP/browser-qa" --no-package-lock --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/browser-qa/node_modules/.bin/playwright" install --with-deps chromium
          cp scripts/verify-production-browser.mjs "$RUNNER_TEMP/browser-qa/check.mjs"
      - name: Verify registration, collaboration, schedule and mobile pages
        env:
          ALLOW_PRODUCTION_QA: 'true'
          VERIFY_ORIGIN: https://47.242.210.133
          VERIFY_OUTPUT_DIR: ${{ runner.temp }}/browser-qa/result
        run: node "$RUNNER_TEMP/browser-qa/check.mjs"
      - name: Remove temporary account credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/browser-qa/result/verification-account.private.json"
      - name: Save verification evidence without credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-verification
          retention-days: 7
          path: |
            ${{ runner.temp }}/browser-qa/result/production-verification.json
            ${{ runner.temp }}/browser-qa/result/production-board.png
            ${{ runner.temp }}/browser-qa/result/production-mobile.png
          if-no-files-found: warn
